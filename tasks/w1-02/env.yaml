# Pinned environment for tasks/w1-02.
#
# uv-managed, CPU only. No GPU, no MPI, no network access at run time.
# The verifier and the implementation need nothing beyond NumPy.

name: w1-02
python: "3.13"
platform: cpu-only

dependencies:
  - numpy==2.3.3

# Create the environment and run the verifier from this directory:
#
#   uv venv --python 3.13 .venv
#   uv pip install --python .venv/bin/python numpy==2.3.3
#   .venv/bin/python verify.py
#
# The repo root declares no runtime dependencies; this file is the whole
# scientific environment for this task.
